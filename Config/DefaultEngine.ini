[/Script/EngineSettings.GameMapsSettings]
; The demo map ships with Slice 4; until then the engine default map is used so that a fresh
; clone opens without a missing-asset warning.
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
EditorStartupMap=/Engine/Maps/Templates/OpenWorld
; Slice 3 demo: any level without its own GameMode override spawns the fleet, wind and danger
; zones from code, so "New Empty Level -> Play" is the whole demo — no .umap to author.
GlobalDefaultGameMode=/Script/NavalNav.NavalNavDemoGameMode

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_BlankBP",NewGameName="/Script/NavalNav")

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False

[/Script/Engine.InputSettings]
; Enhanced Input is the only input path used by this sample; the legacy player input classes
; are redirected so no project setting has to be changed by hand after cloning.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
